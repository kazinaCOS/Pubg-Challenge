<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG Challenge Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <main class="overlay">
    <section class="panel">
      <div class="row">
        <span class="badge task-badge">🎯 ЗАДАНИЕ</span>
        <div class="task-info">
          <span id="overlay-task-title" class="task-title">Нет задания</span>
          <span id="overlay-task-desc" class="task-desc" style="display:none"></span>
        </div>
      </div>

      <div class="curses-block">
        <div class="row">
          <span class="badge punishment-badge">⚠ НАКАЗАНИЯ</span>
          <span id="overlay-curses-empty" class="content">Нет активных наказаний</span>
        </div>
        <div id="overlay-curses" class="curse-stack"></div>
      </div>

      <div class="row stats">
        <span class="mini">✔ Выполнено <strong id="overlay-completed">0</strong></span>
        <span class="mini">✖ Провалено <strong id="overlay-failed">0</strong></span>
      </div>
    </section>
  </main>

  <script src="overlay.js"></script>
</body>
</html>
