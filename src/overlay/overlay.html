<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG Challenge Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="drag-handle" class="drag-handle" style="display:none">
    <span class="drag-hint">✥ Перетащи чтобы переместить &nbsp;|&nbsp; Тяни за край чтобы изменить размер</span>
  </div>
  <main class="overlay">
    <section class="panel">
      <div class="tasks-header">
        <span class="badge task-badge">🎯 ЗАДАНИЯ</span>
      </div>
      <div id="overlay-tasks" class="tasks-list"></div>

      <div class="curses-block">
        <div class="row">
          <span class="badge punishment-badge">⚠ НАКАЗАНИЯ</span>
          <span id="overlay-curses-empty" class="content">Нет активных наказаний</span>
        </div>
        <div id="overlay-curses" class="curse-stack"></div>
      </div>

      <div class="row stats">
        <span class="mini">✔ Выполнено <strong id="overlay-completed">0</strong></span>
        <span class="mini">✖ Провалено <strong id="overlay-failed">0</strong></span>
      </div>
    </section>
  </main>

  <script src="overlay.js"></script>
</body>
</html>
