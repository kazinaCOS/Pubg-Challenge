<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG Challenge Control</title>
  <link rel="stylesheet" href="control.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>PUBG Challenge</h1>
      <p class="subtitle">Control Window</p>
    </header>

    <section class="buttons">
      <button id="btn-new-task" class="primary">🎲 Новое задание</button>
      <button id="btn-complete" class="success">✅ Выполнено</button>
      <button id="btn-fail" class="danger">❌ Провалено</button>
      <button id="btn-editor">📝 Редактор</button>
      <button id="btn-settings" class="secondary">⚙ Настройки</button>
    </section>

    <section class="info">
      <article class="card">
        <div class="label">Текущее задание</div>
        <div id="current-task-title" class="value task-title">Нет задания</div>
        <div id="current-task-desc" class="task-desc"></div>
      </article>

      <article class="card">
        <div class="label">Активные наказания</div>
        <div id="active-curses" class="curse-list">Нет активных наказаний</div>
      </article>

      <article class="stats-grid">
        <div class="stat">
          <span class="label">Выполнено</span>
          <span id="completed" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Провалено</span>
          <span id="failed" class="value">0</span>
        </div>
      </article>
    </section>
  </main>

  <div id="settings-modal" class="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2>Настройки оверлея</h2>

      <div class="field-row">
        <label class="field">
          <span>X</span>
          <input id="overlay-x" type="number" step="1">
        </label>
        <label class="field">
          <span>Y</span>
          <input id="overlay-y" type="number" step="1">
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>Ширина (px)</span>
          <input id="overlay-width" type="number" step="10" min="300">
        </label>
        <label class="field">
          <span>Высота (px)</span>
          <input id="overlay-height" type="number" step="10" min="120">
        </label>
      </div>

      <div class="modal-actions">
        <button id="btn-save-settings" class="primary">💾 Сохранить</button>
        <button id="btn-reset-progress" class="danger">🗑 Сбросить прогресс</button>
        <button id="btn-close-settings" class="secondary">✖ Закрыть</button>
      </div>
    </div>
  </div>

  <script src="control.js"></script>
</body>
</html>
