<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG Challenge Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <main class="editor">
    <header class="topbar">
      <h1>Редактор заданий и наказаний</h1>
      <div class="topbar-actions">
        <label class="generator-toggle-label">
          <input type="checkbox" id="generator-toggle">
          <span>Генератор</span>
        </label>
        <button id="btn-import" class="secondary">📂 Импорт</button>
        <button id="btn-export" class="secondary">💾 Экспорт</button>
        <button id="btn-save-all" class="primary">✔ Сохранить всё</button>
      </div>
    </header>

    <section class="grid">
      <article class="panel">
        <div class="panel-head">
          <h2>Задания</h2>
          <button id="btn-add-task">+ Добавить</button>
        </div>
        <div id="tasks-list" class="list"></div>
      </article>

      <article class="panel">
        <div class="panel-head">
          <h2>Наказания</h2>
          <button id="btn-add-curse">+ Добавить</button>
        </div>
        <div id="curses-list" class="list"></div>
      </article>
    </section>
  </main>

  <script src="editor.js"></script>
</body>
</html>
